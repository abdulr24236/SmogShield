# Shared configuration for Deliverable 2.
#
# The processed feature table is generated by data_scripts/09_build_features.py.
# It is not committed (see .gitignore); restore it from the shared Drive or
# regenerate it before running the modelling code.

seed: 42

paths:
  features: data/processed/features_daily.csv
  results: outputs/model_results
  charts: outputs/model_charts
  models: models

data:
  date_column: date

  # The feature table contains both next-day targets. Keep all of them out of
  # the feature matrix; only the target selected by the model is used as y.
  target_columns:
    - target_next_pm25
    - target_next_log
    - target_next_aqi_category

  target_regression: target_next_pm25
  target_classification: target_next_aqi_category

  # Derived/duplicated columns that should not be model inputs.
  # season has explicit season_* dummies in the feature table.
  # year is kept in the feature table for EDA but excluded from modelling:
  # training ends in 2023 while validation/test continue to 2025, so tree
  # models cannot extrapolate it and linear/neural models may invent a trend.
  # month, day_of_year and the cyclical encodings carry the seasonality.
  drop_columns:
    - season
    - year

  # The Phase 2 table contains robust-scaled weather columns computed on all
  # rows. Using them would leak validation/test statistics into training, so
  # the model code drops them and refits scaling on the training split only.
  exclude_suffixes:
    - _scaled

  categorical_features:
    - aqi_category

  # Good has only 9 training rows and none in validation/test. Merge it with
  # Moderate for the classification target so every class has support in every
  # split. The raw feature table still keeps the original seven categories.
  label_merge:
    Good: "Good/Moderate"
    Moderate: "Good/Moderate"

  # Six-class ordinal order after the Good/Moderate merge. The two Hazardous
  # bands are kept separate but their small validation/test support must be
  # reported as a limitation.
  classification_labels:
    - "Good/Moderate"
    - Unhealthy for Sensitive
    - Unhealthy
    - Very Unhealthy
    - Hazardous (301-400)
    - Hazardous (401-500)

split:
  # Chronological split. The 7-day gap purges labels that would otherwise
  # overlap across boundaries because the target is tomorrow's value and the
  # longest rolling feature uses a 7-day window.
  #
  # Current date-based counts are approximately 68/17/15:
  #   train 1,022 | validation 250 | test 223
  # Re-check with: python -m src.check_setup
  train_end: "2023-06-30"
  validation_end: "2024-06-30"
  gap_days: 7
  test_end: null

metrics:
  classification:
    - accuracy
    - precision_macro
    - recall_macro
    - f1_macro
    - f1_weighted
    - roc_auc_ovr_macro
    - per_class
  regression:
    - rmse
    - mae
    - r2
